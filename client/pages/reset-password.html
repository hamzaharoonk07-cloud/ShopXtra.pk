<title>Reset Password | ShopXtra</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<meta name="description" content="Reset your ShopXtra account password.">
<link rel="canonical" href="https://www.shopxtra.store/pages/reset-password.html">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link href="/css/vendor/bootstrap.min.css" rel="stylesheet">
<link href="/css/style.css?v=20260806h" rel="stylesheet">

<div id="page-loader-slot"></div>
<div id="navbar-slot"></div>

<main class="container py-4">
  <div class="mx-auto" style="max-width: 480px;">
    <form id="reset-password-form" class="filter-panel">
      <h2 class="h4 mb-3">Choose a new password</h2>
      <div class="mb-3">
        <label class="form-label" for="reset-password-input">New password</label>
        <div class="password-field-wrap">
          <input type="password" class="form-control" id="reset-password-input" required minlength="8">
          <button type="button" class="password-toggle-btn" data-target="reset-password-input" aria-label="Show password">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="form-text">At least 8 characters.</div>
      </div>
      <p class="d-none mb-3" id="reset-password-message"></p>
      <button type="submit" class="btn btn-plum w-100">Reset password</button>
    </form>
    <p class="d-none text-center" id="reset-password-no-token" style="color:#6b5a58;">
      This link is missing its reset token. Request a new one from the <a href="/pages/account.html">account page</a>.
    </p>
  </div>
</main>

<div id="footer-slot"></div>

<script src="/js/vendor/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/reset-password.js"></script>
